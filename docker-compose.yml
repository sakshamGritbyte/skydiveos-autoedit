# Single-VM deployment: API + Celery worker + Redis on one box.
# API and worker SHARE the `jobs` volume (the worker must see uploaded footage) and
# the SAME Redis. Bring it up with:  docker compose up -d --build
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      JOBS_ROOT: /data/jobs
      # The browsable jump archive (api/archive.py). A HOST bind mount, not a named
      # volume, for two reasons: it survives `up --build` (the container layer does
      # not), and the dropzone can rsync it down without docker exec. Costs disk —
      # being a separate mount from `jobs`, archived masters are copied rather than
      # hardlinked (place() falls back automatically).
      RAW_STORAGE_ROOT: /data/raw-storage
    volumes:
      - jobs:/data/jobs                  # api writes uploaded footage here
      - ./raw-storage:/data/raw-storage  # {date}/{instructor}/{customer}/ archive
    ports:
      - "8000:8000"
    depends_on: [redis]
    restart: unless-stopped

  worker:
    build: .
    # --concurrency=2: at most 2 jumps process at once (each pegs CPU). Drop to 1 to
    # keep the API snappier during heavy jobs.
    command: celery -A api.celery_app.celery_app worker -l info --concurrency=2
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      JOBS_ROOT: /data/jobs
      RAW_STORAGE_ROOT: /data/raw-storage
    volumes:
      - jobs:/data/jobs                  # SAME volume — worker reads that footage
      - ./raw-storage:/data/raw-storage  # the worker writes renders + photos here
    depends_on: [redis]
    restart: unless-stopped

  # The SkydiveOS raw-upload consumer, until the SkydiveOS backend implements the
  # staff_id contract (SKYDIVEOS_INTEGRATION.md). The dropzone's ingest machine POSTs
  # {s3_key, camera_id, captured_at, staff_id} here; the bridge matches the clip to a
  # load/jumper (MONGO_URL), debounces a jump's clips, then creates ONE job on `api`.
  #
  # It runs HERE and not on the ingest machine on purpose: it fetches the masters back
  # out of S3 to attach them, which belongs on the same box as the API (S3 -> EC2)
  # rather than crossing the dropzone's uplink twice.
  #
  # SECURITY: discovery's notify carries no auth header, so this port's only gate is
  # the network. Publish it to the ingest machine's IP alone (security group), or put
  # it behind the same TLS proxy that fronts 8000 and change the publish below to
  # "127.0.0.1:9000:9000". Stopping this service leaves api/worker untouched.
  bridge:
    build: .
    command: python scripts/skydiveos_bridge.py --host 0.0.0.0 --port 9000 --api http://api:8000
    env_file: .env
    environment:
      JOBS_ROOT: /data/jobs
    volumes:
      - jobs:/data/jobs                  # _bridge_state.json: dedupe/flags survive a restart
    ports:
      - "9000:9000"
    depends_on: [api]
    restart: unless-stopped

volumes:
  jobs:
